name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    # The application drives Windows APIs (winreg, pyautogui, pygetwindow), so
    # the suite has to run on Windows. Provider and GUI calls are mocked, so
    # this needs neither network access nor a Quicken installation.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Read from the repository's own declaration so the tested release and
          # the documented one cannot drift apart.
          python-version-file: ".python-version"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Byte-compile every module
        run: python -m compileall -q .

      - name: Unit tests
        run: python -m unittest -v

      - name: Tests under pytest
        run: python -m pytest -q

      - name: Tests under pytest, with a lowercased drive
        # VS Code's test adapter resolves the workspace URI (file:///c%3A/...), so
        # pytest puts a lowercase-drive path on sys.path and `__file__` keeps that
        # case. Emulating it is what makes this gate able to fail: comparing Windows
        # paths as strings passed everything above and failed in the IDE. Drop this
        # step only when no assertion derives a path from `__file__`.
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          if ($root -match '^[A-Za-z]:') {
            $root = $root.Substring(0, 1).ToLower() + $root.Substring(1)
          }
          python -m pytest -q $root

      - name: Lint
        run: python -m ruff check .
